<!doctype html><!-- Rendu d’images de la Terre avec le moteur du globe (image d’accueil assets/globe/earth-hero.webp).
     Servir la racine du dépôt, ouvrir scripts/render-earth.html, puis dans la console :
     await go({w:1200,h:2500,lat:18,lon:-22,km:11400}) et capturer la page (recadrage 0,0,1200,1500). -->
<html><head><meta charset="utf-8"><base href="../"><style>html,body{margin:0;background:#000}#h{position:relative;width:1200px;height:1500px;overflow:hidden;background:#000}</style></head>
<body><div id="h"></div>
<script src="ocean-map-model.js"></script><script src="ocean-globe.js"></script>
<script>
window.go=async(o)=>{const h=document.getElementById('h');h.style.width=o.w+'px';h.style.height=o.h+'px';h.innerHTML='';
  const g=await OceanGlobe.create(h,{lighting:o.light||'studio',clouds:true});g.setSpots([]);
  if(o.pad)g.setPadding(o.pad);g.jumpTo({lat:o.lat,lon:o.lon,widthKm:o.km});window.g=g;return 1;};
</script></body></html>
