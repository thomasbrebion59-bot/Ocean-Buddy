[build]
  publish = ".netlify/publish"
  command = "node scripts/build-ai-catalog.cjs && node scripts/build-static.cjs"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# En-têtes de sécurité du site web (Netlify uniquement : GitHub Pages et l'app native ne les reçoivent pas).
# 'unsafe-inline' reste nécessaire tant que index.html et app.js utilisent un script de démarrage
# et des gestionnaires onclick en ligne ; la CSP limite tout de même les origines des scripts,
# des connexions et des cadres. Vérifiée dans Chrome headless pendant l’audit (out/audit/securite.md).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://exquisite-choux-61c0d9.netlify.app https://*.supabase.co https://api.open-meteo.com https://marine-api.open-meteo.com https://commons.wikimedia.org https://upload.wikimedia.org https://thumb.wikimedia.org https://tiles.openfreemap.org https://tile.openstreetmap.org https://gibs.earthdata.nasa.gov https://tiles.mapterhorn.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src https://www.google.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
